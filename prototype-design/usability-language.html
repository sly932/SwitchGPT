<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>switchgpt-sly · 交互预览</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:#202124;background:#e9edf1}*{box-sizing:border-box}body{margin:0;padding:32px}h1{font-size:22px;margin:0 0 8px}p{margin:0;color:#5e6670;font-size:13px;line-height:1.5}.note{margin-bottom:24px}.layout{display:grid;grid-template-columns:minmax(520px,1fr) 390px;gap:20px;max-width:1210px}.window,.popover{background:#f8f9fa;border:1px solid #d6dbe0;border-radius:15px;box-shadow:0 12px 36px #26344518;overflow:hidden}.toolbar{height:47px;background:#f0f2f4;border-bottom:1px solid #dce1e5;display:flex;align-items:center;padding:0 18px;gap:10px;font-size:13px}.dots{display:flex;gap:7px;margin-right:12px}.dots i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}.main{padding:26px}.card{background:#f2f3f4;border:1px solid #e1e3e5;border-radius:15px;padding:18px}.heading{font-size:15px;font-weight:650}.sub{font-size:12px;color:#6b737b;margin-top:4px}.stats{display:flex;margin:18px 0;padding:15px;background:white;border:1px solid #e7e9eb;border-radius:10px}.stat{flex:1;text-align:center;border-right:1px solid #e8eaed}.stat:last-child{border:0}.stat strong{display:block;font-size:20px;font-weight:550}.stat span{font-size:11px;color:#69717a}.charthead{display:flex;align-items:center;justify-content:space-between}.seg{display:flex;background:#e2e6e9;border-radius:8px;padding:3px;gap:2px}.seg button{border:0;background:transparent;border-radius:6px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}.seg button.active{background:white;box-shadow:0 1px 3px #0002}.heatmap{display:grid;grid-template-rows:repeat(7,16px);grid-auto-flow:column;grid-auto-columns:16px;gap:4px;max-width:100%;overflow-x:auto;padding:12px 2px 18px}.day{border:0;border-radius:4px;width:16px;height:16px;padding:0;cursor:pointer;background:#e6e7e8}.day[data-level="1"]{background:#b8d7f5}.day[data-level="2"]{background:#78b8f0}.day[data-level="3"]{background:#3398e7}.day[data-level="4"]{background:#0a84ff}.day:hover,.day:focus-visible{outline:2px solid #176fc4;outline-offset:2px}.hint{font-size:11px;color:#68717a}.tooltip{position:fixed;pointer-events:none;padding:7px 9px;background:#242b32;color:white;border-radius:7px;font-size:12px;box-shadow:0 5px 15px #0003;z-index:10;opacity:0;transform:translateY(3px);transition:opacity .1s,transform .1s}.tooltip.show{opacity:1;transform:translateY(0)}.popover{align-self:start;padding:10px}.menu-title{font-size:11px;color:#69717a;font-weight:600;padding:7px 8px}.divider{height:1px;background:#e3e5e7;margin:8px 0}.action,.account{width:100%;display:flex;align-items:center;gap:9px;border:0;border-radius:7px;background:transparent;text-align:left;padding:9px 8px;font-size:13px;color:#202124;cursor:pointer;transition:background .12s,box-shadow .12s}.action:hover,.action:focus-visible{background:#e5e9ed;box-shadow:inset 0 0 0 1px #d3dce4}.action:active{background:#d3e6f8}.action:disabled{opacity:.42;cursor:default;background:none;box-shadow:none}.action .icon,.account .icon{width:17px;text-align:center;color:#596571}.account{background:#e5f2ff}.account:hover{background:#d5eaff}.account small{font-size:11px;color:#69717a;margin-left:auto}.account .check{color:#289748}.status{font-size:11px;color:#767d84;padding:8px}.settings{margin-top:20px;max-width:650px}.settings .main{padding:20px}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 15px;border:1px solid #e2e5e8;border-radius:11px;background:#fff;margin-top:14px}.settings-row label{font-weight:600;font-size:13px}.settings-row small{display:block;font-weight:400;color:#69717a;margin-top:4px}.settings-row select{font:inherit;padding:7px 28px 7px 10px;border:1px solid #ccd4db;border-radius:7px;background:#fff;min-width:155px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#25303b;color:#fff;border-radius:8px;padding:9px 14px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}@media(max-width:950px){body{padding:18px}.layout{grid-template-columns:1fr}.popover{max-width:390px}}@media(max-width:560px){.stats{flex-wrap:wrap;gap:12px}.stat{min-width:40%;border:0}.main{padding:16px}}
  </style>
</head>
<body>
  <h1>switchgpt-sly · 交互预览</h1>
  <p class="note">全部账号和数值均为演示数据。把鼠标移到每日方格与菜单功能行，打开设置并切换语言。</p>
  <div class="layout">
    <div>
      <section class="window">
        <div class="toolbar"><span class="dots"><i></i><i></i><i></i></span><strong data-i18n="usage">用量</strong><span>· demo@example.com</span></div>
        <div class="main"><div class="card">
          <div class="heading" data-i18n="tokenActivity">Token 活动</div><div class="sub" data-i18n="subtitle">当前所选账号的 Codex 用量</div>
          <div class="stats"><div class="stat"><strong>1.25亿</strong><span data-i18n="total">累计 Token 数</span></div><div class="stat"><strong>1,280万</strong><span data-i18n="peak">单日峰值 Token</span></div><div class="stat"><strong>8 天</strong><span data-i18n="streak">当前连续天数</span></div></div>
          <div class="charthead"><div class="heading" data-i18n="distribution">活动分布</div><div class="seg"><button class="active" data-mode="daily" data-i18n="daily">每日</button><button data-mode="weekly" data-i18n="weekly">每周</button><button data-mode="cumulative" data-i18n="cumulative">累计</button></div></div>
          <div class="heatmap" id="heatmap"></div><div class="hint" id="chartHint" data-i18n="chartHint">悬浮在日期方格上查看当天数值。未返回的日期不按零用量计算。</div>
        </div></div>
      </section>
      <section class="window settings"><div class="toolbar"><span class="dots"><i></i><i></i><i></i></span><strong data-i18n="settings">设置</strong></div><div class="main"><div class="heading" data-i18n="general">通用</div><div class="settings-row"><label for="language" data-i18n="language">语言<small data-i18n="languageHelp">自动跟随系统，也可以单独指定</small></label><select id="language"><option value="system">跟随系统</option><option value="zh">简体中文</option><option value="en">English</option></select></div></div></section>
    </div>
    <section class="popover"><button class="action" data-action="dashboard"><span class="icon">▣</span><span data-i18n="dashboard">打开主窗口</span></button><div class="divider"></div><div class="menu-title" data-i18n="accounts">账号</div><button class="account" data-action="account"><span class="icon">◉</span><span>demo@example.com</span><small>Plus · 68%</small><span class="check">✓</span></button><div class="status" data-i18n="updated">所有账号刚刚更新</div><div class="divider"></div><button class="action" data-action="refresh"><span class="icon">↻</span><span data-i18n="refresh">刷新用量</span></button><button class="action" data-action="settings"><span class="icon">☷</span><span data-i18n="display">自定义显示…</span></button><button class="action" data-action="quit"><span class="icon">⏻</span><span data-i18n="quit">退出 switchgpt-sly</span></button></section>
  </div>
  <div class="tooltip" id="tooltip"></div><div class="toast" id="toast"></div>
  <script>
    const zh={usage:'用量',tokenActivity:'Token 活动',subtitle:'当前所选账号的 Codex 用量',total:'累计 Token 数',peak:'单日峰值 Token',streak:'当前连续天数',distribution:'活动分布',daily:'每日',weekly:'每周',cumulative:'累计',chartHint:'悬浮在日期方格上查看当天数值。未返回的日期不按零用量计算。',settings:'设置',general:'通用',language:'语言',languageHelp:'自动跟随系统，也可以单独指定',dashboard:'打开主窗口',accounts:'账号',updated:'所有账号刚刚更新',refresh:'刷新用量',display:'自定义显示…',quit:'退出 switchgpt-sly'};
    const en={usage:'Usage',tokenActivity:'Token activity',subtitle:'Codex usage for the selected account',total:'Lifetime tokens',peak:'Peak daily tokens',streak:'Current streak',distribution:'Activity distribution',daily:'Daily',weekly:'Weekly',cumulative:'Cumulative',chartHint:'Hover over a day to see its value. Missing dates are not counted as zero usage.',settings:'Settings',general:'General',language:'Language',languageHelp:'Follow the system or choose a language for this app',dashboard:'Open Dashboard',accounts:'Accounts',updated:'All accounts just updated',refresh:'Refresh Usage',display:'Customize Display…',quit:'Quit switchgpt-sly'};
    const values=[1234,0,218000,980000,1800000,12800000,124500000,null,620000,45000,0,3400000,9700,750000];
    const heatmap=document.querySelector('#heatmap'),tip=document.querySelector('#tooltip');let language='zh';
    function compact(v){if(v===null)return language==='zh'?'未返回数据':'No data';let units=language==='zh'?[[1e8,'亿'],[1e7,'千万'],[1e6,'百万'],[1e4,'万'],[1e3,'千']]:[[1e9,'B'],[1e6,'M'],[1e3,'K']];for(const [n,s] of units)if(v>=n)return (Math.round(v/n*10)/10).toString()+s;return v.toLocaleString()}
    for(let i=0;i<70;i++){const v=values[i%values.length],b=document.createElement('button');b.className='day';b.type='button';b.dataset.level=v===null?0:v===0?0:v<1e5?1:v<1e6?2:v<1e7?3:4;b.dataset.date=`2026-07-${String(i%30+1).padStart(2,'0')}`;b.dataset.value=v===null?'':v;b.setAttribute('aria-label',b.dataset.date+' '+compact(v));b.addEventListener('pointerenter',()=>showTip(b));b.addEventListener('pointermove',e=>moveTip(e));b.addEventListener('pointerleave',()=>tip.classList.remove('show'));b.addEventListener('focus',()=>showTip(b));b.addEventListener('blur',()=>tip.classList.remove('show'));heatmap.appendChild(b)}
    function showTip(b){const v=b.dataset.value===''?null:Number(b.dataset.value);tip.textContent=`${b.dataset.date} · ${compact(v)} Token${v===null?'':` (${v.toLocaleString()})`}`;tip.classList.add('show');const r=b.getBoundingClientRect();tip.style.left=`${Math.min(r.left,innerWidth-tip.offsetWidth-10)}px`;tip.style.top=`${Math.max(8,r.top-tip.offsetHeight-8)}px`}
    function moveTip(e){tip.style.left=`${Math.min(e.clientX+10,innerWidth-tip.offsetWidth-10)}px`;tip.style.top=`${Math.max(8,e.clientY-tip.offsetHeight-10)}px`}
    function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),1700)}
    document.querySelectorAll('.action,.account').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='settings'){document.querySelector('.settings').scrollIntoView({behavior:'smooth',block:'center'});document.querySelector('#language').focus()}else toast((language==='zh'?'演示操作：':'Demo action: ')+b.innerText.trim())}));
    document.querySelector('#language').addEventListener('change',e=>{language=e.target.value==='en'?'en':'zh';document.documentElement.lang=language==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(el=>{if(el.tagName==='LABEL'){el.firstChild.textContent=(language==='zh'?zh:en).language;el.querySelector('small').textContent=(language==='zh'?zh:en).languageHelp}else el.textContent=(language==='zh'?zh:en)[el.dataset.i18n]});for(const b of heatmap.children)b.setAttribute('aria-label',b.dataset.date+' '+compact(b.dataset.value===''?null:Number(b.dataset.value)));toast(language==='zh'?'已切换演示语言':'Demo language changed')});
    document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));toast((language==='zh'?'演示视图：':'Demo view: ')+b.textContent)}));
  </script>
</body>
</html>
