<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全部账号 Token 用量 · 交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#202020;background:white;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.demo{padding:9px 16px;background:#e9f3fc;color:#356581;display:flex;align-items:center;gap:14px;font-size:12px}.demo button{border:1px solid #cadbe8;border-radius:7px;padding:5px 9px;background:white;cursor:pointer}.app{display:flex;min-height:800px}.sidebar{width:268px;flex-shrink:0;background:linear-gradient(#ecedef,#e5f1fa);padding:20px 8px;border-right:1px solid #ddd}.add{color:#0a84ff;padding:10px;font-size:14px}.heading{padding:20px 10px 8px;color:#777}.account{padding:12px;border-radius:10px;cursor:pointer;margin-bottom:4px}.account.active{background:#dce4eb}.account small{color:#777;display:block;margin-top:5px}.main{flex:1;min-width:0}.toolbar{height:46px;border-bottom:1px solid #f3f3f3;padding:0 16px;display:flex;align-items:center;gap:8px}.toolbar button{margin-left:auto;border:0;background:transparent;color:#0a84ff;cursor:pointer;font-size:21px}.content{max-width:914px;margin:auto;padding:30px 32px;display:grid;gap:22px}.account-header{font-size:18px;font-weight:600}.account-header small{display:block;font-size:13px;color:#777;margin-top:5px;font-weight:400}.quota{background:#f3f3f3;border:1px solid #ddd;border-radius:15px;padding:18px}.bar{background:#ddd;height:7px;border-radius:10px;margin-top:12px}.bar span{display:block;background:#0a84ff;width:31%;height:100%;border-radius:10px}.card{padding:18px;background:#f3f3f3;border:1px solid #dedede;border-radius:15px;display:grid;gap:18px}.title{display:flex;justify-content:space-between;gap:10px}.title strong{font-size:14px}.title small{display:block;color:#777;font-size:12px;margin-top:4px}.badge{font-size:11px;color:#999;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(5,1fr);border-radius:11px;border:1px solid #ddd;background:white;padding:10px 0}.metric{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;position:relative}.metric:not(:last-child):after{content:"";position:absolute;right:0;top:9px;bottom:9px;border-right:1px solid #e5e5e5}.value{font-size:19px;font-weight:500}.label{font-size:11px;color:#777}.section{display:flex;align-items:center;justify-content:space-between}.section strong{font-size:14px}.segments{border-radius:7px;padding:2px;background:#e1e1e1;display:flex;width:200px}.segments button{width:33.33%;border:0;background:transparent;border-radius:5px;padding:4px;cursor:pointer}.segments .selected{background:white;box-shadow:0 1px 3px #bbb}.heatmap{display:flex;gap:4px;overflow-x:auto;padding:3px 2px 8px}.week{display:grid;grid-template-rows:repeat(7,14px) 16px;gap:4px;flex-shrink:0}.cell{width:14px;height:14px;border:0;border-radius:4px;cursor:pointer;background:#e6e6e6}.cell:focus,.cell:hover{outline:2px solid #0a84ff}.month{font-size:10px;color:#777}.legend{display:flex;gap:5px;align-items:center;font-size:10px;color:#777}.legend i{width:11px;height:11px;border-radius:3px;background:#e6e6e6}.note{font-size:11px;color:#777;line-height:1.6;margin:0}.tooltip{position:fixed;display:none;pointer-events:none;border-radius:9px;padding:8px 12px;background:#1c2126;color:white;font-size:12px;z-index:2;box-shadow:0 4px 9px #0002}.empty{padding:42px 12px;text-align:center;color:#777}@media(max-width:1030px){.metrics{grid-template-columns:repeat(3,1fr)}.metric:after{display:none}.badge{white-space:normal;text-align:right}}@media(max-width:700px){.sidebar{width:150px}.content{padding:24px 16px}.demo{flex-wrap:wrap}.segments{width:160px}}
</style>
<div class="demo">演示数据 · 沿用当前面板样式 <button id="failure">模拟账号读取失败</button><button id="empty">模拟无数据</button><span id="status">已选布局：侧栏账号总览 · 仅随其他位置刷新</span></div>
<div class="app"><aside class="sidebar"><div class="add">＋ 添加账号</div><div class="account active" id="overview">▦ 账号总览</div><div class="heading">账号 <span style="float:right">3</span></div><div class="account" data-account="0">◉ 演示账号 A<small>Plus · 当前账号</small></div><div class="account" data-account="1">◉ 演示账号 B<small>Pro</small></div><div class="account" data-account="2">◉ 演示账号 C<small>Plus</small></div></aside><main class="main"><div class="toolbar"> <span id="selected">演示账号 A</span><button id="refresh" aria-label="刷新全部账号用量">⟳</button></div><div class="content"><div class="account-header"><span id="name">演示账号 A</span><small>Plus</small></div><div class="quota">每周用量 <span style="float:right">已用 31%</span><div class="bar"><span></span></div></div><div id="global"></div><div id="individual"></div></div></main></div><div class="tooltip" id="tip"></div>
<script>
const titles=['累计 Token 数','单日峰值 Token','最长单轮时长','当前连续天数','最长连续天数'];let overview=true,selected=0,failed=false,empty=false,refreshes=0,modes={global:0,individual:0};let values=[[1200000,140000,3600,4,12],[2600000,200000,7200,8,20],[800000,100000,1800,3,9]];const daily=values.map((_,a)=>Array.from({length:364},(_,i)=>i%19===0?null:((i*17+a*11)%8===0?0:((i*7+a*3)%30)*1100)));
function number(v){return v>=1e6?(v/1e6).toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'百万':v>=1e4?(v/1e4).toFixed(1).replace(/\.0$/,'')+'万':String(v)}function format(v,i){return i===2?Math.floor(v/3600)+'时 '+Math.floor(v%3600/60)+'分':i>2?v+'天':number(v)}
function renderCard(id){const global=id==='global',rows=global?values.filter((_,i)=>!failed||i!==2):[values[selected]],v=rows.reduce((r,row)=>row.map((n,i)=>n+r[i]),[0,0,0,0,0]);const series=global?daily[0].map((_,i)=>{const ds=daily.filter((_,a)=>!failed||a!==2).map(s=>s[i]).filter(x=>x!==null);return ds.length?ds.reduce((a,b)=>a+b,0):null}):daily[selected];let plotted=[...series];if(modes[id]===1)plotted=plotted.map((_,i)=>{const week=series.slice(Math.floor(i/7)*7,Math.floor(i/7)*7+7).filter(x=>x!==null);return week.length?week.reduce((a,b)=>a+b,0):null});if(modes[id]===2){let total=0;plotted=series.map(n=>n===null?null:total+=n)}const peak=Math.max(...plotted.filter(n=>n!==null),1);
const el=document.getElementById(id);el.innerHTML=`<section class="card"><div class="title"><div><strong>${global?'全部账号 Token 活动':'Token 活动'}</strong><small>${global?`${rows.length} 个账号 · ${rows.length} 个有 Token 数据${failed?' · 1 个读取失败账号未计入':''}`:'当前所选账号的 Codex 用量'}</small></div><span class="badge">${global?'全部账号汇总':'Codex 账号用量'}</span></div>${empty?'<div class="empty">暂无 Token 数据<br><small>稍后点击右上角的刷新按钮重试。</small></div>':`<div class="metrics">${v.map((n,i)=>`<div class="metric"><span class="value">${format(n,i)}</span><span class="label">${titles[i]}</span></div>`).join('')}</div><div class="section"><strong>活动分布</strong><div class="segments">${['每日','每周','累计'].map((t,i)=>`<button data-mode="${i}" class="${modes[id]===i?'selected':''}">${t}</button>`).join('')}</div></div><div class="heatmap">${Array.from({length:52},(_,w)=>`<div class="week">${Array.from({length:7},(_,d)=>{const i=w*7+d,n=plotted[i],date=new Date(Date.UTC(2025,9,10+i)).toISOString().slice(0,10);return `<button class="cell" aria-label="${date} · ${n===null?'未返回数据':n+' Token'}" style="background:${n===null?'#ececec':n===0?'#ddd':`rgba(10,132,255,${Math.max(.25,n/peak)})`}"></button>`}).join('')}<span class="month">${w%4===0?((Math.floor(w/4)+9)%12+1)+'月':''}</span></div>`).join('')}</div><div class="legend">未返回<i></i>零<i style="background:#ddd"></i>少${[.25,.45,.7,1].map(a=>`<i style="background:rgba(10,132,255,${a})"></i>`).join('')}多</div><p class="note">${['每日图显示最近一年。未返回的日期不按零用量计算。','每列代表一周，只汇总该周已返回的每日记录；没有记录的周显示浅灰。','每格代表截至当天已返回记录的累计值；没有记录的日期显示浅灰。此值可能小于上方的全生命周期总量。'][modes[id]]}</p>`}${global?'<p class="note">各指标为账号对应数值之和，峰值、单轮时长和连续天数均直接相加。随其他位置的用量刷新更新。</p>':''}</section>`;
el.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{modes[id]=+b.dataset.mode;renderCard(id)});el.querySelectorAll('.cell').forEach(c=>{c.onmouseenter=()=>{const tip=document.getElementById('tip'),r=c.getBoundingClientRect();tip.textContent=c.getAttribute('aria-label');tip.style.display='block';tip.style.left=Math.min(Math.max(8,r.x-80),innerWidth-270)+'px';tip.style.top=(r.y-38)+'px'};c.onmouseleave=()=>document.getElementById('tip').style.display='none'})}
function render(){document.querySelector('.account-header').hidden=overview;document.querySelector('.quota').hidden=overview;document.getElementById('global').hidden=!overview;document.getElementById('individual').hidden=overview;document.getElementById('refresh').hidden=overview;document.getElementById('overview').classList.toggle('active',overview);document.getElementById('selected').textContent=document.getElementById('name').textContent='演示账号 '+['A','B','C'][selected];document.getElementById('selected').textContent=overview?'账号总览':document.getElementById('selected').textContent;renderCard('global');renderCard('individual')}
document.querySelectorAll('[data-account]').forEach(e=>e.onclick=()=>{overview=false;selected=+e.dataset.account;document.querySelectorAll('[data-account]').forEach(a=>a.classList.toggle('active',a===e));render()});document.getElementById('overview').onclick=()=>{overview=true;document.querySelectorAll('[data-account]').forEach(a=>a.classList.remove('active'));render()};document.getElementById('refresh').onclick=()=>{values[0][0]+=100000;daily[0][363]+=100000;refreshes++;document.getElementById('status').textContent=`其他位置已刷新 ${refreshes} 次 · 汇总已跟随更新`;render()};document.getElementById('failure').onclick=()=>{failed=!failed;render()};document.getElementById('empty').onclick=()=>{empty=!empty;render()};render();
</script></html>
