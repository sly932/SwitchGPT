<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Quota Timeline</title>
<style>
  :root {
    color-scheme: light dark;
    --canvas: #f1f3f7;
    --surface: #fff;
    --well: #f7f8fb;
    --ink: #172237;
    --muted: #536177;
    --faint: #626f83;
    --hair: #dce3ed;
    --grid: #e8edf4;
    --rail: 26px;
    --rail-edge: #d9e3f1;
    --cycle: #e7eef9;
    --cycle-alt: #edf2fa;
    --cycle-line: #cfdaea;
    --blue: #2852bc;
    --forecast: #486685;
    --control-fill: #e7ecf4;
    --accent-bg: #eef3ff;
    --amber: #8b470e;
    --amber-bg: #fff7ed;
    --amber-edge: #e5bf94;
    --violet: #6038ae;
    --violet-strong: #563098;
    --violet-bg: #f0eafa;
    --violet-edge: #bdace1;
    --editing: #faf7ff;
    --sim-cycle: #e8def7;
    --sim-alt: #f0e9fa;
    --axis-left: 36px;
    --axis-right: 37px;
    --account-col: 222px;
    --shadow: 0 18px 56px #33446a13, 0 2px 6px #33446a0a;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
  }
  * { box-sizing: border-box; }
  body { min-width: 320px; margin: 0; background: var(--canvas); padding: clamp(12px, 4.2vw, 50px) clamp(10px, 3vw, 40px); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

  .window {
    max-width: 1250px; margin-inline: auto; border: 1px solid var(--hair);
    border-radius: 22px; background: var(--surface); box-shadow: var(--shadow);
  }
  .content { padding: 29px 28px 20px; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 20px; }
  .heading { min-width: 0; }
  h1 { font-size: clamp(27px, 3.6vw, 35px); font-weight: 740; line-height: 1.16; letter-spacing: -.045em; margin: 3px 0 10px; }
  .snapshot { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; color: var(--muted); margin: 0; font-size: 12px; }
  .snapshot time { font-variant-numeric: tabular-nums; }
  .sample {
    display: inline-flex; align-items: center; gap: 5px; border-radius: 5px;
    padding: 2px 6px; border: 1px solid var(--hair); background: var(--well); color: var(--muted);
  }
  .refresh-quota {
    margin-top: 7px; min-height: 28px; padding: 3px 8px; color: var(--blue); font-weight: 660; font-size: 12px;
    border: 1px solid var(--hair); border-radius: 6px; background: var(--surface);
  }
  .refresh-quota:not(:disabled):hover { background: var(--accent-bg); border-color: var(--blue); }
  .refresh-quota:disabled { color: var(--faint); }
  .empty-state {
    min-height: 170px; display: grid; place-items: center; text-align: center; margin: 0;
    border: 1px solid var(--hair); border-radius: 13px; padding: 20px; color: var(--muted); background: var(--well);
  }
  .sample::before { content: ""; width: 5px; height: 5px; border-radius: 100%; background: var(--forecast); }
  .range-panel {
    width: 282px; flex: 0 0 auto; padding: 10px 13px 9px; border: 1px solid var(--hair);
    border-radius: 12px; background: var(--well);
  }
  .range-heading, .range-endpoints { display: flex; align-items: center; justify-content: space-between; }
  .range-heading label { font-size: 12px; font-weight: 660; }
  .range-heading output { margin: 0 auto 0 8px; color: var(--blue); font-size: 13px; font-weight: 720; font-variant-numeric: tabular-nums; }
  .switch { display: flex; padding: 2px; background: var(--control-fill); border-radius: 7px; gap: 2px; }
  .switch button { border: 0; background: transparent; min-width: 37px; min-height: 27px; border-radius: 5px; font-size: 12px; color: var(--muted); }
  .switch button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px #121b3125; font-weight: 690; }
  #range { appearance: none; -webkit-appearance: none; width: 100%; height: 23px; display: block; margin: 1px 0 0; background: transparent; cursor: ew-resize; }
  #range::-webkit-slider-runnable-track { height: 5px; border-radius: 6px; background: linear-gradient(to right, var(--blue) var(--slider-fill), var(--control-fill) var(--slider-fill)); }
  #range::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; margin-top: -5px; width: 15px; height: 15px; border: 2px solid var(--surface); border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  #range::-moz-range-track { height: 5px; border-radius: 6px; background: var(--control-fill); }
  #range::-moz-range-progress { height: 5px; background: var(--blue); }
  #range::-moz-range-thumb { width: 12px; height: 12px; border: 2px solid var(--surface); border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .range-endpoints { font-variant-numeric: tabular-nums; color: var(--faint); font-size: 11px; }
  .legend {
    min-height: 26px; display: flex; align-items: center; gap: 8px 19px;
    flex-wrap: wrap; margin: 0 0 5px; color: var(--muted); font-size: 12px;
  }
  .legend > span { display: inline-flex; align-items: center; gap: 7px; }
  .legend b { font-weight: inherit; }
  .key { width: 8px; height: 8px; display: inline-block; border-radius: 50%; background: var(--blue); }
  .key.forecast { background: var(--surface); border: 1.5px solid var(--forecast); }
  .key.expiry { border-radius: 1px; transform: rotate(45deg); background: var(--amber); }
  .key.use { border-radius: 2px; background: var(--violet); }

  .chart { overflow-x: auto; isolation: isolate; scroll-padding-inline-start: var(--account-col); }
  .chart:focus-visible { outline-offset: -2px; }
  .matrix { min-width: max(680px, calc(var(--account-col) + var(--axis-left) + var(--axis-right) + var(--card-space, 0px))); display: grid; gap: 8px; padding-bottom: 2px; }
  .row { display: grid; grid-template-columns: var(--account-col) minmax(0, 1fr); }
  .axis {
    border-inline: 1px solid transparent; height: 34px; color: var(--faint); font-size: 11px;
  }
  .axis-account, .account { position: sticky; left: 0; z-index: 5; padding-inline: 17px; }
  .axis-account { display: flex; align-items: center; background: var(--surface); font-weight: 670; }
  .axis-plot { position: relative; margin-inline: var(--axis-left) var(--axis-right); }
  .axis-tick { position: absolute; bottom: 0; left: var(--x); transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .axis-tick:first-child { color: var(--blue); font-weight: 700; }
  .axis-tick::after { content: ""; display: block; width: 1px; height: 6px; margin: 3px auto 0; background: var(--hair); }
  .lane {
    position: relative; min-height: 151px; border: 1px solid var(--hair); border-radius: 13px; background: var(--surface);
  }
  .lane.editing { border-color: var(--violet-edge); }
  .account {
    padding-block: 12px 8px; display: flex; flex-direction: column;
    border-radius: 12px 0 0 12px; background: var(--well); border-right: 1px solid var(--hair);
  }
  .lane.editing .account { background: var(--editing); }
  .account-title {
    margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 15px; font-weight: 710; letter-spacing: -.018em;
  }
  .account-note { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
  .account-note.stale { color: var(--amber); }
  .unknown-reset { position: absolute; top: calc(var(--y) - 24px); color: var(--muted); font-size: 12px; }
  .plan { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 7px; margin: 4px 0 5px; color: var(--muted); font-size: 11px; }
  .plan-tier { border: 1px solid var(--hair); border-radius: 4px; padding: 0 4px; background: var(--surface); color: var(--muted); font-weight: 680; white-space: nowrap; }
  .plan small { font-size: inherit; }
  .quota-value { display: flex; align-items: baseline; gap: 8px; }
  .quota-value strong { font-size: 32px; font-weight: 740; letter-spacing: -.062em; line-height: 1.13; font-variant-numeric: tabular-nums; }
  .quota-value small { color: var(--muted); font-size: 11px; }
  .quota-meter { height: 10px; border-radius: 6px; background: var(--control-fill); overflow: hidden; margin-top: 6px; }
  .quota-meter i { height: 100%; background: var(--blue); border-radius: inherit; display: block; min-width: 3px; }
  .quota-meter i.low { background: var(--amber); }
  .row-action {
    align-self: flex-start; display: inline-flex; align-items: center; min-height: 27px; margin-top: 5px;
    border: 0; border-radius: 5px; padding: 0 5px; background: transparent; color: var(--violet);
    font-size: 11px; font-weight: 660;
  }
  .row-action:not(:disabled):hover { background: var(--violet-bg); }
  .row-action:disabled { color: var(--faint); }
  .lane-plot { position: relative; min-width: 0; }
  .track { position: relative; height: 100%; min-height: 149px; margin-inline: var(--axis-left) var(--axis-right); --y: 59px; }
  .event-grid { position: absolute; left: var(--x); width: 1px; inset-block: 9px; background: var(--grid); pointer-events: none; }
  .base-rail {
    position: absolute; inset-inline: 0; top: var(--y); height: var(--rail);
    border: 1px solid var(--rail-edge); border-radius: 999px; background: var(--cycle); overflow: hidden;
  }
  .row.editing .base-rail { cursor: crosshair; }
  .cycle-segment { position: absolute; inset-block: 0; left: var(--x); width: var(--w); border-right: 1px solid var(--cycle-line); background: var(--cycle); pointer-events: none; }
  .cycle-segment:nth-child(even) { background: var(--cycle-alt); }
  .cycle-segment.simulated { background: var(--sim-cycle); border-right-color: var(--violet-edge); }
  .cycle-segment.simulated:nth-child(even) { background: var(--sim-alt); }
  .reset-node {
    --mark: var(--blue); position: absolute; z-index: 2; top: calc(var(--y) - 3px); left: var(--x);
    transform: translateX(-50%); height: 31px; width: 10px; background: transparent; border: 0; padding: 0;
  }
  .reset-node.forecast { --mark: var(--forecast); }
  .reset-node.simulated { --mark: var(--violet); }
  .reset-node::before { content: ""; position: absolute; inset-block: 4px; left: calc(50% - 1px); width: 2px; border-radius: 2px; background: var(--mark); }
  .reset-node.forecast::before { width: 1px; }
  .reset-node::after { content: ""; position: absolute; top: 0; left: 50%; width: 7px; height: 7px; background: var(--mark); border-radius: 50%; transform: translateX(-50%); }
  .reset-node.forecast::after { background: var(--surface); border: 1.5px solid var(--mark); width: 6px; height: 6px; }
  .reset-node:is(:hover, :focus-visible)::after { box-shadow: 0 0 0 3px var(--accent-bg); }
  .reset-label {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%); white-space: nowrap; color: var(--mark);
    font-size: 12px; font-variant-numeric: tabular-nums; font-weight: 650; pointer-events: none; display: var(--label,none);
  }
  .expiry-line, .expiry-link { position: absolute; background: var(--amber-edge); left: var(--x); pointer-events: none; }
  .expiry-line { top: calc(var(--y) + var(--rail)); height: 17px; width: 1px; }
  .expiry-link { top: calc(var(--y) + var(--rail) + 17px); height: 1px; width: var(--w); }
  .expiry-anchor {
    position: absolute; z-index: 3; top: calc(var(--y) + var(--rail) + 7px); left: var(--x);
    width: 18px; height: 18px; transform: translateX(-50%); display: grid; place-items: center; padding: 0; border: 0; background: transparent;
  }
  .expiry-anchor::before { content: ""; width: 7px; height: 7px; background: var(--amber); border-radius: 1px; transform: rotate(45deg); }
  .expiry-anchor:is(:hover, [aria-expanded=true])::before { box-shadow: 0 0 0 3px var(--amber-edge); }
  .expiry-node {
    display: flex; position: absolute; top: calc(var(--y) + var(--rail) + 19px); left: var(--x); transform: translateX(-50%);
    align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--amber-edge); border-radius: 6px;
    background: var(--amber-bg); color: var(--amber); font-size: 12px; font-variant-numeric: tabular-nums;
    font-weight: 670; width: 80px; min-height: 28px; padding: 3px 5px; white-space: nowrap; z-index: 3;
  }
  .expiry-node::before { content: ""; width: 6px; height: 6px; flex: 0 0 auto; background: var(--amber); border-radius: 1px; transform: rotate(45deg); }
  .expiry-node:is(:hover, [aria-expanded=true]) { border-color: var(--amber); }
  .expiry-node.selected { border-color: var(--violet-edge); background: var(--violet-bg); color: var(--violet); }
  .expiry-node.selected:is(:hover, [aria-expanded=true]) { border-color: var(--violet); }
  .use-handle {
    position: absolute; z-index: 4; left: var(--x); top: calc(var(--y) - 3px); transform: translateX(-50%);
    width: 29px; height: 32px; display: grid; place-items: center; padding: 0 2px 0 10px;
    border: 1px solid var(--violet-strong); border-radius: 8px; background: var(--violet-strong); color: #fff;
    font-size: 11px; font-weight: 740; cursor: grab; touch-action: none; box-shadow: 0 0 0 2px var(--surface);
  }
  .use-handle::before { content: ""; position: absolute; left: 6px; top: 11px; width: 4px; height: 9px; border-inline: 1px solid #ffffff94; }
  .use-handle:active { cursor: grabbing; }
  .use-handle[aria-pressed=true] { z-index: 5; box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--violet-edge); }
  .use-time {
    position: absolute; top: calc(var(--y) - 34px); left: clamp(46px, var(--x), calc(100% - 46px)); transform: translateX(-50%);
    background: var(--violet-bg); color: var(--violet); font-size: 11px; font-variant-numeric: tabular-nums; line-height: 1;
    min-height: 23px; border: 1px solid var(--violet-edge); padding: 5px 7px; border-radius: 6px;
    white-space: nowrap; z-index: 3; pointer-events: none;
  }

  .footer { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; color: var(--muted); font-size: 12px; }
  .foot-scroll { display: none; }
  .popover {
    position: fixed; z-index: 20; top: 0; left: 0; width: 263px; max-width: calc(100vw - 16px);
    padding: 13px; border: 1px solid var(--hair); border-radius: 12px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  }
  .p-title { font-size: 14px; font-weight: 720; margin: 0; }
  .p-date, .p-note { margin: 4px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .p-note { margin-top: 7px; }
  .p-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .p-actions button {
    border: 1px solid transparent; border-radius: 6px; padding: 7px 8px; min-height: 33px;
    font-size: 12px; color: #fff; font-weight: 680; background: var(--violet-strong);
  }
  .p-actions button:hover { box-shadow: inset 0 0 0 1px #ffffff65; }
  #card-action.remove { border-color: var(--violet-edge); background: var(--violet-bg); color: var(--violet); }
  #card-action.remove:hover { border-color: var(--violet); }
  .live { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }

  @media (max-width: 850px) {
    :root { --account-col: 181px; --axis-left: 29px; --axis-right: 30px; }
    .content { padding: 22px 17px 16px; }
    .axis-account, .account { padding-inline: 12px; }
    .foot-scroll { display: inline; }
  }
  @media (max-width: 560px) {
    :root { --account-col: 133px; }
    .content { padding: 16px 13px 13px; }
    .top { flex-direction: column; gap: 13px; margin-bottom: 13px; }
    .range-panel { width: min(100%, 355px); }
    .quota-value { display: grid; gap: 2px; }
    .legend { gap: 7px 12px; }
    .footer { flex-direction: column; gap: 3px; }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #171b24; --surface: #202632; --well: #252d3b; --ink: #f0f3f9; --muted: #c1ccdd; --faint: #aebacf;
      --hair: #3b485d; --grid: #303b4b; --rail-edge: #455a75; --cycle: #35465e; --cycle-alt: #2f3f54; --cycle-line: #49617e;
      --blue: #a9c1ff; --forecast: #b5c8e3; --control-fill: #37465c; --accent-bg: #485c83;
      --amber: #ffcc96; --amber-bg: #392d26; --amber-edge: #9c6e48;
      --violet: #ddc9ff; --violet-strong: #6943a8; --violet-bg: #3d3154; --violet-edge: #9c81c5;
      --editing: #302942; --sim-cycle: #4b3a67; --sim-alt: #42335b;
      --shadow: 0 16px 46px #0d101855, 0 2px 6px #0d10182d;
    }
  }
</style>
</head>
<body>
<main class="window">
  <div class="content">
    <header class="top">
      <div class="heading">
        <h1 data-copy="heading">Quota Timeline</h1>
        <p class="snapshot" id="snapshot-meta" hidden>
          <span class="sample" data-copy="snapshot">Quota snapshot</span>
          <span><time id="snapshot"></time> · <span data-copy="timezone">Beijing time</span></span>
        </p>
        <button class="refresh-quota" type="button" id="refresh-quota" disabled>Refresh Usage</button>
      </div>
      <div class="range-panel">
        <div class="range-heading"><label for="range" data-copy="range">Time range</label><output id="range-value" for="range"></output>
          <div class="switch" role="group" data-label="unit" aria-label="Time unit">
            <button type="button" data-unit="day" data-copy="days" aria-pressed="true">Days</button><button type="button" data-unit="month" data-copy="months" aria-pressed="false">Months</button>
          </div>
        </div>
        <input id="range" type="range" min="1" max="90" value="35">
        <div class="range-endpoints"><span id="range-start"></span><span id="range-end"></span></div>
      </div>
    </header>
    <p class="empty-state" id="empty-state" role="status">Loading usage data…</p>
    <div class="legend" data-label="legend" aria-label="Timeline legend" hidden>
      <span><i class="key" aria-hidden="true"></i><b data-copy="knownReset"></b></span>
      <span><i class="key forecast" aria-hidden="true"></i><b data-copy="forecastReset"></b></span>
      <span><i class="key expiry" aria-hidden="true"></i><b data-copy="expiry"></b></span>
      <span><i class="key use" aria-hidden="true"></i><b data-copy="use"></b></span>
    </div>
    <div class="chart" role="region" tabindex="0" data-label="chart" aria-label="Account quota timeline, scroll horizontally" hidden><div class="matrix" id="matrix"></div></div>
    <footer class="footer" hidden><span><span data-copy="usageHint"></span><span class="foot-scroll" data-copy="scrollHint"></span></span><span data-copy="forecastHint"></span></footer>
  </div>
</main>
<div class="popover" id="popover" hidden>
  <p class="p-title" id="p-title"></p><p class="p-date" id="p-date"></p><p class="p-note" id="p-note"></p>
  <div class="p-actions"><button type="button" id="card-adjust" data-copy="adjust" hidden></button><button type="button" id="card-action"></button></div>
</div>
<div id="status" class="live" role="status"></div>
<script>
const day = 86400000;
const week = 7 * day;
const minute = 60000;
let start = NaN;
let accounts = [];
let language = 'en';
let dataKey = null;
let receivedSnapshot = false;
let queuedSnapshot = null;
let layoutPending = false;
const $=selector=>document.querySelector(selector);
const matrix=$('#matrix'), chart=$('.chart'), popup=$('#popover'), action=$('#card-action'), slider=$('#range');
const adjust=$('#card-adjust'), refresh=$('#refresh-quota'), snapshotTime=$('#snapshot');
const ranges={day:35,month:2};
let unit='day', end=0, drag=null, hover=null, closeTimer=0, resizeTimer=0;
const scenarios=new Map();
const editing=new Map();
const laneParts=new Map();
const clock=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function dateParts(ms){return Object.fromEntries(clock.formatToParts(ms).map(part=>[part.type,part.value]))}
function short(ms){const p=dateParts(ms);return Number(p.month)+'/'+Number(p.day)}
function time(ms){const p=dateParts(ms);return short(ms)+' '+p.hour+':'+p.minute}
function exact(ms){const p=dateParts(ms);return p.year+'/'+p.month+'/'+p.day+' '+p.hour+':'+p.minute+':'+p.second}
const strings = {
  heading: ['账号额度图', 'Quota Timeline'],
  snapshot: ['额度快照', 'Quota snapshot'],
  timezone: ['北京时间', 'Beijing time'],
  range: ['时间范围', 'Time range'],
  unit: ['时间单位', 'Time unit'],
  days: ['天', 'Days'],
  months: ['月', 'Months'],
  legend: ['时间轴图例', 'Timeline legend'],
  knownReset: ['已知自然重置', 'Known natural reset'],
  forecastReset: ['预计自然重置', 'Projected natural reset'],
  simulatedReset: ['模拟后的预计自然重置', 'Projected reset after simulated use'],
  expiry: ['重置卡到期', 'Reset card expires'],
  use: ['模拟用卡', 'Simulate card use'],
  useActive: ['已模拟用卡', 'Simulated card use'],
  chart: ['账号额度时间轴，可横向滚动', 'Account quota timeline, scroll horizontally'],
  usageHint: ['悬停卡片进入模拟，再拖动方形标记或点击轨道选择用卡时间。', 'Hover over a card to simulate its use, then drag the square handle or click the track to set a time.'],
  scrollHint: ['横向滑动查看后续日期。', ' Scroll horizontally to see later dates.'],
  forecastHint: ['自然重置按 7 天推算。', 'Natural resets are projected every 7 days.'],
  adjust: ['调整这张卡时间', 'Adjust this card’s time'],
  undo: ['退出这张卡的模拟', 'Undo this card’s simulation'],
  restore: ['恢复此账号', 'Restore this account'],
  accountColumn: ['账号 / 周额度', 'Account / Weekly quota'],
  remaining: ['剩余周额度', 'Weekly quota left'],

function say(message){$('#status').textContent=message}
function dateValue(value){return typeof value==='string'?Date.parse(value):NaN}
function normalizedAccount(account){
  const occurrences=new Map();
  const cards=(account.cards??[]).map(dateValue).filter(Number.isFinite).sort((a,b)=>a-b);
  const cardKeys=cards.map(expiry=>{
    const occurrence=occurrences.get(expiry)??0;
    occurrences.set(expiry,occurrence+1);
    return expiry+':'+occurrence;
  });
  return {
    id:account.id,name:account.name,plan:account.plan,
    remaining:Number.isFinite(account.remaining)?account.remaining:null,
    reset:dateValue(account.resetAt),cardCount:Number.isInteger(account.cardCount)?account.cardCount:null,
    cards,cardKeys,failed:account.failed===true,refreshedAt:dateValue(account.refreshedAt),

function reconcileScenarios(nextAccounts,nextStart){
  const oldAccounts=new Map(accounts.map(account=>[account.id,account]));
  const currentIDs=new Set(nextAccounts.map(account=>account.id));
  for(const id of scenarios.keys()){
    if(!currentIDs.has(id)){scenarios.delete(id);editing.delete(id)}
  }
  for(const account of nextAccounts){
    const previous=oldAccounts.get(account.id);
    const oldSimulations=scenarios.get(account.id)??new Map();
    const oldEdit=editing.get(account.id);
    const newIndices=new Map(account.cardKeys.map((key,index)=>[key,index]));
    const updated=new Map();
    let editIndex;
    for(const [index,when] of oldSimulations){
      const nextIndex=newIndices.get(previous?.cardKeys[index]);
      if(nextIndex===undefined||when<nextStart||when>=account.cards[nextIndex])continue;
      updated.set(nextIndex,when);
      if(index===oldEdit)editIndex=nextIndex;
    }
    scenarios.set(account.id,updated);
    if(editIndex===undefined)editing.delete(account.id);else editing.set(account.id,editIndex);
  }

function getEnd(){

  local.setUTCDate(1);local.setUTCMonth(local.getUTCMonth()+ranges.month);
  const last=new Date(Date.UTC(local.getUTCFullYear(),local.getUTCMonth()+1,0)).getUTCDate();
  local.setUTCDate(Math.min(date,last));
  return +local-8*3600000;
}
function scaleTicks(){
  const days=(end-start)/day;
  const step=[1,2,5,7,10,14,21,30,45,60,90].find(v=>days/v<=6);
  const ticks=[start];
  for(let i=step;i<days;i+=step){if(days-i>=step*.65)ticks.push(start+i*day)}

function replay(account,until){
  const events=[];
  let next=Number.isFinite(account.reset)?account.reset:Infinity;
  let projected=false, first=next>=start;
  if(next<start)next+=Math.ceil((start-next)/week)*week;
  const uses=[...scenarios.get(account.id)].sort((a,b)=>a[1]-b[1]||a[0]-b[0]);
  function addResets(before,inclusive){
    while(next<before || (inclusive&&next===before)){
      if(next>=start)events.push({kind:'reset',time:next,known:first&&!projected,projected});
      first=false;next+=week;
    }
  }
  for(const [card,when] of uses){
    if(when>until)break;
    addResets(when,false);
    events.push({kind:'use',time:when,card});
    projected=true;
    next=when+week;

  }
  if(event.key==='Tab'&&hover&&event.target===(adjust.hidden?action:adjust)&&event.shiftKey){
    event.preventDefault();hover.anchor.focus();return;
  }
  if(event.key==='Tab'&&hover&&event.target===action&&!event.shiftKey){
    const controls=[...matrix.querySelectorAll('button:not(:disabled):not([tabindex="-1"])')];
    const card=hover.anchor.matches('.expiry-node')?hover.anchor:
      laneParts.get(hover.account.id).cards.querySelector('[data-card="'+hover.index+'"]');
    const next=controls[controls.indexOf(card)+1];
    if(next){event.preventDefault();closePopup();next.focus()}
    return;
  }
  const handle=event.target.closest('.use-handle');
  if(!handle||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  event.preventDefault();
  const account=rowFor(handle.dataset.account),index=Number(handle.dataset.handle),now=scenarios.get(account.id).get(index);
  const stride=event.shiftKey?day:60*minute;
  const ms=event.key==='Home'?start:event.key==='End'?Math.min(end,Math.max(start,account.cards[index]-minute)):now+(event.key==='ArrowLeft'?-stride:stride);
  setUse(account,index,ms,{announce:true});
});
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    if(drag){layoutPending=true;return}
    closePopup();
    renderRange();
  },70);
});
window.addEventListener('scroll',closePopup,{passive:true});
chart.addEventListener('scroll',closePopup,{passive:true});
</script>
