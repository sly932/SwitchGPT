<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwitchGPT 重新登录预览</title>
<style>
  body { margin: 0; font: 14px -apple-system, BlinkMacSystemFont, sans-serif; color: #252525; background: #fff; }
  main { max-width: 850px; margin: 60px auto; padding: 0 32px; }
  .heading { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .avatar { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: #f3f3f3; font-size: 24px; }
  h1 { margin: 0; font-size: 19px; } .plan { color: #888; margin-top: 3px; }
  /* 只在选中账号刷新失败时提供明确的恢复操作。 */
  .notice { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #ffd4c5; border-radius: 11px; background: #fff4ee; }
  .icon { color: #ff6b26; font-size: 18px; } .message { flex: 1; line-height: 1.5; }
  button { border: 0; border-radius: 8px; padding: 8px 12px; background: #252525; color: white; font: inherit; cursor: pointer; white-space: nowrap; }
  button:hover { background: #454545; } button:disabled { opacity: .45; cursor: default; }
  .hint { margin: 12px 2px; color: #888; font-size: 12px; }
  @media (max-width: 560px) { .notice { align-items: flex-start; flex-wrap: wrap; } button { margin-left: 30px; } }
</style>
<main>
  <div class="heading"><div class="avatar">◎</div><div><h1>shenliyuan932@gmail.com</h1><div class="plan">Plus</div></div></div>
  <div class="notice"><span class="icon">⚠</span><span class="message" id="message">此账号的用量更新失败，当前显示上次用量。若登录已过期，请重新登录。</span><button id="action">重新登录此账号</button></div>
  <div class="hint">重新登录成功后更新这条账号记录，保留原有位置和账号 ID。</div>
</main>
<script>
  const action = document.getElementById('action');
  action.addEventListener('click', () => {
    action.disabled = true; action.textContent = '等待浏览器登录…';
    document.getElementById('message').textContent = '请在浏览器中完成登录。';
    setTimeout(() => { action.disabled = false; action.textContent = '重新登录此账号'; document.getElementById('message').textContent = '登录完成：原账号凭证已更新，可重新获取用量。'; }, 2500);
  });
</script>
</html>
